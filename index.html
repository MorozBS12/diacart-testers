<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Топ тестеров · 101</title>
<meta name="description" content="Рейтинг тестеров тир-листа DiaCart: кто провёл больше всего тестов.">
<meta property="og:title" content="Топ тестеров DiaCart">
<meta property="og:description" content="Кто провёл больше всего тестов — за неделю, месяц и всё время.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Pixelify+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#14151a; --slate:#1d1f25; --slate-2:#25282f; --edge:#30333b;
  --ink:#ece9e3; --dim:#9c9fa6; --faint:#62666e; --dia:#5fd8e0;
  --gold:242,201,76; --silver:214,217,222; --bronze:208,122,67;
  --gut:clamp(16px,4vw,40px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--ground)}
body{
  min-height:100vh;color:var(--ink);background:var(--ground);
  font:15px/1.45 'Golos Text',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 500px at 50% -120px,rgba(95,216,224,.10),transparent 70%);
}
a{color:inherit;text-decoration:none}
.wrap{max-width:880px;margin:0 auto;padding:0 var(--gut) 64px}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0 8px}
.brand{display:flex;align-items:center;gap:10px;font:600 22px 'Pixelify Sans',sans-serif;letter-spacing:.5px}
.brand b{color:var(--dia)}
.back{font-size:14px;color:var(--dim);border:1px solid var(--edge);padding:8px 14px;border-radius:10px;transition:.15s}
.back:hover{color:var(--ink);border-color:var(--dim)}

.hero{text-align:center;padding:36px 0 26px}
.hero h1{font:700 clamp(32px,7vw,54px)/1.05 'Pixelify Sans',sans-serif;letter-spacing:1px}
.hero h1 span{color:var(--dia)}
.hero p{color:var(--dim);margin-top:10px}
.stats{display:flex;justify-content:center;gap:10px;margin-top:22px;flex-wrap:wrap}
.stat{background:var(--slate);border:1px solid var(--edge);border-radius:14px;padding:10px 18px;min-width:130px}
.stat b{display:block;font:700 24px 'Pixelify Sans',sans-serif;font-variant-numeric:tabular-nums}
.stat small{color:var(--dim);font-size:12.5px}

.tabs{display:flex;justify-content:center;gap:6px;margin:6px 0 30px}
.tabs button{
  font:500 14px 'Golos Text',sans-serif;color:var(--dim);background:transparent;
  border:1px solid var(--edge);border-radius:999px;padding:8px 16px;cursor:pointer;transition:.15s
}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:#0d1114;background:var(--dia);border-color:var(--dia)}

/* пьедестал */
.podium{display:grid;grid-template-columns:1fr 1.12fr 1fr;align-items:end;gap:12px;margin-bottom:28px}
.pc{
  --c:var(--silver);position:relative;text-align:center;border-radius:18px;padding:22px 12px 18px;
  background:linear-gradient(180deg,rgba(var(--c),.16),rgba(var(--c),.03) 70%),var(--slate);
  border:1px solid rgba(var(--c),.35);
}
.pc.p1{--c:var(--gold);padding-top:30px;padding-bottom:26px;box-shadow:0 10px 40px -12px rgba(var(--gold),.35)}
.pc.p3{--c:var(--bronze)}
.pc .place{
  position:absolute;top:-14px;left:50%;transform:translateX(-50%);
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  font:700 15px 'Pixelify Sans',sans-serif;color:#14151a;background:rgb(var(--c))
}
.pc .av{width:72px;height:72px;margin:0 auto 10px;border:3px solid rgb(var(--c))}
.pc.p1 .av{width:88px;height:88px}
.pc .nm{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .rl{color:var(--dim);font-size:12.5px;margin-top:2px;min-height:18px}
.pc .num{font:700 30px/1 'Pixelify Sans',sans-serif;margin-top:12px;color:rgb(var(--c));font-variant-numeric:tabular-nums}
.pc.p1 .num{font-size:38px}
.pc .lbl{color:var(--dim);font-size:12px;margin-top:4px}

.av{border-radius:50%;object-fit:cover;background:var(--slate-2);display:grid;place-items:center;
  font:700 18px 'Pixelify Sans',sans-serif;color:var(--dim);flex-shrink:0}

/* список */
.list{display:flex;flex-direction:column;gap:8px}
.row{
  display:grid;grid-template-columns:34px 44px 1fr auto;align-items:center;gap:12px;
  background:var(--slate);border:1px solid var(--edge);border-radius:14px;padding:10px 14px
}
.row .pos{font:600 16px 'Pixelify Sans',sans-serif;color:var(--faint);text-align:center;font-variant-numeric:tabular-nums}
.row .av{width:44px;height:44px;font-size:16px}
.row .who{min-width:0}
.row .who b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .who small{color:var(--dim);font-size:12.5px}
.bar{height:5px;border-radius:3px;background:var(--slate-2);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--dia),rgba(95,216,224,.45))}
.row .cnt{text-align:right}
.row .cnt b{font:700 20px 'Pixelify Sans',sans-serif;font-variant-numeric:tabular-nums}
.row .cnt small{display:block;color:var(--dim);font-size:12px}

.empty,.loading{text-align:center;color:var(--dim);padding:40px 16px;background:var(--slate);border:1px solid var(--edge);border-radius:14px}
footer{text-align:center;color:var(--faint);font-size:12.5px;margin-top:36px}
footer a{color:var(--dim);border-bottom:1px solid var(--edge)}

@media (max-width:620px){
  /* на телефоне — тоже пьедестал, только компактный */
  .podium{grid-template-columns:1fr 1.15fr 1fr;gap:7px;margin-top:22px}
  .pc{padding:16px 6px 12px;border-radius:14px}
  .pc.p1{padding-top:22px;padding-bottom:16px}
  .pc .place{width:24px;height:24px;font-size:12px;top:-12px}
  .pc .nm{font-size:13px}
  .pc .rl{font-size:10.5px;min-height:14px}
  .pc .num{font-size:22px;margin-top:6px}
  .pc.p1 .num{font-size:28px}
  .pc .lbl{font-size:10.5px}
  .pc .av{width:52px;height:52px}
  .pc.p1 .av{width:62px;height:62px}
  .row{grid-template-columns:26px 38px 1fr auto;gap:10px;padding:9px 12px}
  .row .av{width:38px;height:38px}
  .stat{min-width:0;flex:1}
}

/* ---- оформление: тронный зал ---- */
.tabs.kinds{margin-bottom:10px;flex-wrap:wrap}
.tabs.kinds button{font-size:13px;padding:7px 14px}
.pc .bust{display:block;height:130px;margin:-6px auto 6px;image-rendering:pixelated;filter:drop-shadow(0 8px 10px rgba(0,0,0,.6)) drop-shadow(0 0 14px rgba(var(--c),.35))}
.pc.p1 .bust{height:160px}
.pc .av.mob{display:none}
.av.head{border-radius:0;background:none;object-fit:contain;filter:drop-shadow(0 3px 4px rgba(0,0,0,.6))}
@media (max-width:620px){
  .pc .bust{height:82px;margin:-2px auto 4px}
  .pc.p1 .bust{height:100px}
  .pc.p1::before{top:-26px;width:28px;height:18px}
}
:root{--dia:#f2c94c}
html{background:#0b0906}
body{
  background:
    linear-gradient(180deg,rgba(8,6,4,.55) 0%,rgba(8,6,4,.78) 38%,rgba(10,8,6,.96) 70%,#0b0906 100%),
    url('bg.jpg') center top/cover no-repeat fixed;
}
@supports (-webkit-touch-callout:none){body{background-attachment:scroll,scroll}}
.hero{padding:70px 0 34px}
.hero h1{font-size:clamp(40px,9vw,72px);filter:drop-shadow(0 4px 0 rgba(0,0,0,.6)) drop-shadow(0 0 24px rgba(242,201,76,.35))}
.hero h1 span{background:linear-gradient(180deg,#fff8d6,#ffd75e 50%,#f0b23c);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:#d8cbb0;text-shadow:0 2px 6px #000}
.brand b{color:#f2c94c}
.stat,.row,.empty,.loading,.back,.tabs button{background:rgba(22,18,12,.55);border-color:rgba(242,201,76,.18);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.stat b{color:#f6dc8a}
.tabs button.on{color:#1a1206;background:linear-gradient(180deg,#ffe08a,#e0a93a);border-color:#e0a93a;box-shadow:0 4px 18px -4px rgba(242,201,76,.6)}
.pc{background:linear-gradient(180deg,rgba(var(--c),.22),rgba(var(--c),.04) 70%),rgba(22,18,12,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.pc.p1{box-shadow:0 0 0 1px rgba(var(--gold),.5),0 18px 60px -14px rgba(var(--gold),.55)}
.pc.p1::before{content:'';position:absolute;top:-30px;left:50%;width:34px;height:22px;transform:translateX(-50%);
  background:linear-gradient(180deg,#ffe9a0,#e0a93a);clip-path:polygon(0 100%,0 30%,25% 60%,50% 0,75% 60%,100% 30%,100% 100%);filter:drop-shadow(0 2px 6px rgba(242,201,76,.7))}
.pc.p1 .place{top:-12px}
.row{transition:transform .15s,border-color .15s}
.row:hover{transform:translateX(4px);border-color:rgba(242,201,76,.45)}
.bar i{background:linear-gradient(90deg,#f2c94c,rgba(242,201,76,.35))}
footer{color:#7d7464}
/* искры */
.sparks{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.sparks i{position:absolute;bottom:-10px;width:3px;height:3px;background:#ffd36a;box-shadow:0 0 6px #ffb84a;opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:.9}100%{transform:translateY(-105vh) translateX(30px);opacity:0}}
.wrap{position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){.sparks{display:none}}
</style>
</head>
<body>
<div class="sparks" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <a class="brand" href="https://101tiers.xyz"><b>101</b> DiaCart</a>
    <a class="back" href="https://101tiers.xyz">← Тир-лист</a>
  </header>

  <section class="hero">
    <h1>Топ <span>тестеров</span></h1>
    <p>Кто провёл больше всего тестов в тир-листе DiaCart</p>
    <div class="stats" id="stats"></div>
  </section>

  <nav class="tabs kinds" id="kinds">
    <button data-k="all">Все тесты</button>
    <button data-k="high">Высокие (HT3+)</button>
    <button data-k="low">Квалификация</button>
  </nav>
  <nav class="tabs" id="tabs">
    <button data-p="week">Неделя</button>
    <button data-p="month">Месяц</button>
    <button data-p="all">Всё время</button>
  </nav>

  <main id="main"><div class="loading">Загрузка…</div></main>

  <footer>
    Обновляется автоматически после каждого теста · <a href="https://101tiers.xyz">Тир-лист DiaCart</a>
  </footer>
</div>

<script>
// данные отдаёт бот DiaCart
const API = 'https://101tiers.xyz/api/site/testers';
const WORD = n => (n % 10 === 1 && n % 100 !== 11 ? 'тест' : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? 'теста' : 'тестов');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data = null;
let period = 'month';
let kind = 'all';
try { kind = localStorage.getItem('testers-kind') || 'all'; } catch (e) {}
try { period = localStorage.getItem('testers-period') || 'month'; } catch (e) {}

function ago(ms){
  if(!ms) return '';
  const d = Math.floor((Date.now() - ms) / 86400e3);
  if(d <= 0) return 'сегодня';
  if(d === 1) return 'вчера';
  if(d < 7) return d + ' дн. назад';
  if(d < 30) return Math.floor(d / 7) + ' нед. назад';
  return Math.floor(d / 30) + ' мес. назад';
}

function avatar(t, cls){
  if(t.avatar) return `<img class="av ${cls||''}" src="${esc(t.avatar)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML='<span class=&quot;av ${cls||''}&quot;>${esc((t.name||'?')[0].toUpperCase())}</span>'">`;
  return `<span class="av ${cls||''}">${esc((t.name || '?')[0].toUpperCase())}</span>`;
}

// Скин тестера (если известен его ник в Minecraft), иначе аватарка Discord
// 3D-бюст скина: если один сервис не ответил, пробуем следующий (везде бюст, а не просто голова)
const BUST = n => [
  `https://visage.surgeplay.com/bust/256/${n}`,
  `https://starlightskins.lunareclipse.studio/render/default/${n}/bust`,
  `https://mc-heads.net/body/${n}/180`,
];
function nextSkin(img){
  const list = JSON.parse(img.dataset.src || '[]');
  const i = +(img.dataset.i || 0) + 1;
  if(i < list.length){ img.dataset.i = i; img.src = list[i]; } else img.onerror = null;
}
const bustImg = (t0, cls) => { const urls = BUST(encodeURIComponent(mcOf(t0)));
  return `<img class="${cls}" src="${urls[0]}" data-src='${JSON.stringify(urls)}' alt="" loading="lazy" onerror="nextSkin(this)">`; };
const skinBust = t0 => bustImg(t0, 'bust');
const head = (t0, c) => bustImg(t0, 'av head ' + (c || ''));

function render(){
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.p === period));
  const main = document.getElementById('main');
  document.querySelectorAll('#kinds button').forEach(b => b.classList.toggle('on', b.dataset.k === kind));
  const p0 = data.periods[period];
  // сколько тестов считаем: все, только высокие или только квалификация
  const cnt = t => kind === 'high' ? t.high : kind === 'low' ? t.tests - t.high : t.tests;
  const list = p0.testers.map(t => ({...t, tests: cnt(t), high: kind === 'all' ? t.high : 0}))
    .filter(t => t.tests > 0).sort((a, b) => b.tests - a.tests || b.last - a.last);
  const p = {total: list.reduce((n, t) => n + t.tests, 0), testers: list};
  document.getElementById('stats').innerHTML =
    `<div class="stat"><b>${p.total}</b><small>${WORD(p.total)} проведено</small></div>` +
    `<div class="stat"><b>${list.length}</b><small>активных тестеров</small></div>`;
  if(!list.length){ main.innerHTML = '<div class="empty">За этот период тестов пока не было.</div>'; return; }

  const top = list.slice(0, 3);
  const order = [top[1], top[0], top[2]];
  const podium = `<div class="podium">${order.map((t, i) => {
    if(!t) return '<div></div>';
    const place = [2, 1, 3][i];
    return `<div class="pc p${place}">
      <span class="place">${place}</span>
      ${skinBust(t)}
      <div class="nm">${esc(t.name)}</div>
      <div class="rl">${esc(t.role || (t.username ? '@' + t.username : ''))}</div>
      <div class="num">${t.tests}</div>
      <div class="lbl">${WORD(t.tests)}${t.high ? ` · ${t.high} высоких` : ''}</div>
    </div>`;
  }).join('')}</div>`;

  const max = list[0].tests || 1;
  const rows = list.slice(3).map((t, i) => `
    <div class="row">
      <span class="pos">${i + 4}</span>
      ${head(t)}
      <div class="who">
        <b>${esc(t.name)}</b>
        <small>${esc(t.role || '')}${t.role && t.last ? ' · ' : ''}${t.last ? 'последний ' + ago(t.last) : ''}</small>
        <div class="bar"><i style="width:${Math.max(4, Math.round(t.tests / max * 100))}%"></i></div>
      </div>
      <div class="cnt"><b>${t.tests}</b><small>${WORD(t.tests)}</small></div>
    </div>`).join('');

  main.innerHTML = podium + (rows ? `<div class="list">${rows}</div>` : '');
}

async function getJson(url, ms){
  const c = new AbortController(); const t = setTimeout(() => c.abort(), ms);
  try { const r = await fetch(url, {signal: c.signal}); if(!r.ok) throw new Error(r.status); return await r.json(); }
  finally { clearTimeout(t); }
}

async function load(){
  try{
    data = await getJson(API + '?t=' + Date.now(), 15000);
  }catch(e){
    if(!data) document.getElementById('main').innerHTML = '<div class="empty">Не удалось загрузить. Обновите страницу.</div>';
    return;
  }
  render();
}

document.getElementById('kinds').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  kind = b.dataset.k;
  try { localStorage.setItem('testers-kind', kind); } catch (err) {}
  if(data) render();
});
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  period = b.dataset.p;
  try { localStorage.setItem('testers-period', period); } catch (err) {}
  if(data) render();
});

load();
setInterval(load, 60000);
// золотые искры, как от огня в тронном зале
(() => { const box = document.querySelector('.sparks'); if(!box) return;
  for(let i = 0; i < 26; i++){ const e = document.createElement('i');
    e.style.left = Math.random() * 100 + '%'; const d = 9 + Math.random() * 12;
    e.style.animationDuration = d + 's'; e.style.animationDelay = -Math.random() * d + 's';
    if(Math.random() < .3){ e.style.width = e.style.height = '4px'; } box.appendChild(e); } })();
</script>
</body>
</html>
